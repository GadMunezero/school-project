name: tradeloom

x-backend-env: &backend-env
  TRADELOOM_ENV: ${TRADELOOM_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tradeloom:tradeloom@postgres:5432/tradeloom}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-tradeloom-uploads}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tradeloom}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tradeloom-secret}
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@tradeloom.local}
  STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
  STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeloom}
      POSTGRES_DB: ${POSTGRES_DB:-tradeloom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeloom} -d ${POSTGRES_DB:-tradeloom}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tradeloom}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-tradeloom-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-tradeloom} ${S3_SECRET_ACCESS_KEY:-tradeloom-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-tradeloom-uploads} &&
      mc anonymous set none local/${S3_BUCKET:-tradeloom-uploads} &&
      echo 'object storage ready'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *backend-env
    command: ["/app/docker/entrypoint-api.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *backend-env
    command: ["/app/docker/entrypoint-worker.sh"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *backend-env
    command: ["celery", "-A", "worker.celery_app.celery_app", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

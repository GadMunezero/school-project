[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeloom"
version = "0.1.0"
description = "Tradeloom — trading journal, analytics, and deterministic backtesting platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "redis>=5.0",
    "boto3>=1.34",
    "polars>=1.5",
    "numpy>=1.26",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
worker = ["celery[redis]>=5.4"]
billing = ["stripe>=10.5"]
dev = [
    "celery[redis]>=5.4",
    "stripe>=10.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anyio>=4.4",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-boto3",
]

[project.scripts]
tradeloom = "tradeloom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradeloom*"]

[tool.setuptools.package-data]
tradeloom = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the documented idiom
    "S101",    # asserts are used in tests
    "RUF012",  # ClassVar annotations on SQLAlchemy/declarative attrs are noisy
    "SIM108",  # ternaries are not always clearer
    # Optional strategy lifecycle hooks are deliberately concrete no-ops: a strategy should be
    # able to implement only `on_bar`, so making them abstract would break every subclass.
    "B027",
    # Flags enum members and constants whose *names* contain "PASSWORD" (PASSWORD_CHANGED,
    # PURPOSE_RESET_PASSWORD). None of them hold a credential.
    "S105",
    # `wait-for-db --timeout` is a CLI argument, not an asyncio cancellation scope.
    "ASYNC109",
    # Broad catches are used only where a secondary concern (audit write, progress update,
    # storage cleanup) must never fail the primary operation. Each site logs and comments why.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"tradeloom/seed/**" = ["S311"]  # deterministic non-crypto RNG for demo data

[tool.ruff.lint.isort]
known-first-party = ["tradeloom", "worker"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "(alembic/versions|tests)"

[[tool.mypy.overrides]]
module = ["tradeloom.seed.*", "tradeloom.cli"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra"
